name: Release gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.lock
      - run: npm --prefix frontend ci
      - run: python scripts/check.py
      - run: npm --prefix frontend audit --audit-level=high --include=dev
      - run: python scripts/security_scan.py
      - run: docker build -t specguard-runner:local -f backend/runner/Dockerfile .
      - run: |
          mkdir -p artifacts/security
          docker save --output artifacts/security/runner-image.tar specguard-runner:local
          docker run --rm -v "$PWD/artifacts/security:/scan" aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format json --output /scan/runner-trivy.json --input /scan/runner-image.tar
      - run: python -m pytest tests/test_docker_runner.py -q
        env:
          SPECGUARD_DOCKER_TESTS: '1'
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: specguard-deployment-bundle
          path: artifacts/releases/
          retention-days: 14
          if-no-files-found: error
